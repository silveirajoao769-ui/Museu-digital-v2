<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acervo Fotográfico | Museu Digital de Meleiro</title><style>body{margin:0;background:#f5f0e7;color:#271e1c;font-family:Georgia,serif}header{padding:28px 6%;border-bottom:1px solid #cfc4b7}header a{color:#672d40;text-decoration:none}main{max-width:1300px;margin:auto;padding:60px 5%}h1{font-size:clamp(40px,6vw,84px);margin:10px 0}p{font:16px/1.6 Arial,sans-serif;color:#5c524c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:35px}.tile{background:#e3dbd1;border:0;padding:0;text-align:left;cursor:pointer;color:inherit}.tile img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.tile span{display:block;padding:14px;font:14px Arial,sans-serif}dialog{width:min(96vw,1100px);max-height:95vh;border:0;background:#171513;color:#fff;padding:16px}dialog::backdrop{background:#000d}dialog img{display:block;max-width:100%;max-height:72vh;margin:auto;object-fit:contain}dialog p{color:#f4e9db}button{cursor:pointer}.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}.controls button{padding:12px 16px;background:#672d40;color:#fff;border:0}small{font:12px Arial,sans-serif;color:#7d716a}</style></head><body><header><a href="/">← Voltar ao Museu Digital de Meleiro</a></header><main><small>ACERVO / COLEÇÃO EM CATALOGAÇÃO</small><h1>Paisagens, caminhos<br>e memórias.</h1><p>Fotografias recebidas para preservação digital. Datas, localidades e autoria aguardam confirmação. As imagens foram giradas para exibição e otimizadas sem alteração do conteúdo.</p><div class="grid" id="grid"></div></main><dialog id="viewer"><img id="large" alt=""><p id="caption"></p><div class="controls"><button id="prev">← Anterior</button><span id="counter"></span><button id="next">Próxima →</button><button id="close">Fechar ×</button></div></dialog><script>const photos=[{"src": "/assets/acervo/foto-01.webp", "caption": "Registro fotográfico 01 — identificação e data em pesquisa."}, {"src": "/assets/acervo/foto-02.webp", "caption": "Registro fotográfico 02 — identificação e data em pesquisa."}, {"src": "/assets/acervo/foto-03.webp", "caption": "Registro fotográfico 03 — identificação e data em pesquisa."}, {"src": "/assets/acervo/foto-04.webp", "caption": "Registro fotográfico 04 — identificação e data em pesquisa."}, {"src": "/assets/acervo/foto-05.webp", "caption": "Registro fotográfico 05 — identificação e data em pesquisa."}, {"src": "/assets/acervo/foto-06.webp", "caption": "Registro fotográfico 06 — identificação e data em pesquisa."}, {"src": "/assets/acervo/foto-07.webp", "caption": "Registro fotográfico 07 — identificação e data em pesquisa."}, {"src": "/assets/acervo/foto-08.webp", "caption": "Registro fotográfico 08 — identificação e data em pesquisa."}, {"src": "/assets/acervo/foto-09.webp", "caption": "Registro fotográfico 09 — identificação e data em pesquisa."}, {"src": "/assets/acervo/foto-10.webp", "caption": "Registro fotográfico 10 — identificação e data em pesquisa."}, {"src": "/assets/acervo/foto-11.webp", "caption": "Registro fotográfico 11 — identificação e data em pesquisa."}, {"src": "/assets/acervo/foto-12.webp", "caption": "Registro fotográfico 12 — identificação e data em pesquisa."}, {"src": "/assets/acervo/foto-13.webp", "caption": "Registro fotográfico 13 — identificação e data em pesquisa."}, {"src": "/assets/acervo/foto-14.webp", "caption": "Registro fotográfico 14 — identificação e data em pesquisa."}, {"src": "/assets/acervo/foto-15.webp", "caption": "Registro fotográfico 15 — identificação e data em pesquisa."}];const grid=document.getElementById('grid'),viewer=document.getElementById('viewer'),large=document.getElementById('large'),caption=document.getElementById('caption'),counter=document.getElementById('counter');let current=0,startX=0;function show(i){current=(i+photos.length)%photos.length;large.src=photos[current].src;large.alt=photos[current].caption;large.onerror=()=>{caption.textContent='Não foi possível carregar esta imagem.'};caption.textContent=photos[current].caption;counter.textContent=(current+1)+' / '+photos.length}photos.forEach((p,i)=>{let b=document.createElement('button');b.className='tile';let im=document.createElement('img');im.src=p.src;im.alt=p.caption;im.loading='lazy';im.onerror=()=>{im.alt='Imagem temporariamente indisponível';im.style.display='none';label.textContent='Imagem indisponível — '+p.caption};let label=document.createElement('span');label.textContent=p.caption;b.append(im,label);b.onclick=()=>{show(i);viewer.showModal()};grid.append(b)});document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.getElementById('close').onclick=()=>viewer.close();document.addEventListener('keydown',e=>{if(!viewer.open)return;if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});large.addEventListener('touchstart',e=>startX=e.touches[0].clientX,{passive:true});large.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>45)show(current+(d<0?1:-1))},{passive:true});</script></body></html>
