caption=document.getElementById('caption'),counter=document.getElementById('counter');let current=0,startX=0;function show(i){current=(i+photos.length)%photos.length;large.src=photos[current].src;large.alt=photos[current].caption;large.onerror=()=>{caption.textContent='Não foi possível carregar esta imagem.'};caption.textContent=photos[current].caption;counter.textContent=(current+1)+' / '+photos.length}photos.forEach((p,i)=>{let b=document.createElement('button');b.className='tile';let im=document.createElement('img');im.src=p.src;im.alt=p.caption;im.loading='lazy';im.onerror=()=>{im.alt='Imagem temporariamente indisponível';im.style.display='none';label.textContent='Imagem indisponível — '+p.caption};let label=document.createElement('span');label.textContent=p.caption;b.append(im,label);b.onclick=()=>{show(i);viewer.showModal()};grid.append(b)});document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.getElementById('close').onclick=()=>viewer.close();document.addEventListener('keydown',e=>{if(!viewer.open)return;if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});large.addEventListener('touchstart',e=>startX=e.touches[0].clientX,{passive:true});large.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>45)show(current+(d<0?1:-1))},{passive:true});</script></body></html>
